<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 498 200">
  <rect fill="#0f172a" width="498" height="200"/>
  
  <!-- Вид сбоку -->
  <g transform="translate(10, 10)">
    <text x="0" y="10" fill="#94a3b8" font-size="10" font-weight="bold">ВИД СБОКУ - Эсминец</text>
    
    <!-- Корпус -->
    <path d="M 40,80 L 60,70 L 420,70 L 440,80 L 420,90 L 60,90 Z" 
          fill="#1e293b" stroke="#475569" stroke-width="1"/>
    
    <!-- Отсеки -->
    <rect x="60" y="73" width="72" height="14" fill="#16a34a" opacity="0.7" stroke="#475569" stroke-width="0.5"/>
    <rect x="132" y="73" width="72" height="14" fill="#16a34a" opacity="0.7" stroke="#475569" stroke-width="0.5"/>
    <rect x="204" y="73" width="72" height="14" fill="#16a34a" opacity="0.7" stroke="#475569" stroke-width="0.5"/>
    <rect x="276" y="73" width="72" height="14" fill="#16a34a" opacity="0.7" stroke="#475569" stroke-width="0.5"/>
    <rect x="348" y="73" width="72" height="14" fill="#16a34a" opacity="0.7" stroke="#475569" stroke-width="0.5"/>
    
    <!-- Башни -->
    <circle cx="120" cy="65" r="5" fill="#334155" stroke="#64748b" stroke-width="1"/>
    <circle cx="360" cy="65" r="5" fill="#334155" stroke="#64748b" stroke-width="1"/>
    
    <!-- Мостик -->
    <rect x="230" y="55" width="30" height="15" fill="#475569" stroke="#64748b" stroke-width="1"/>
  </g>
  
  <!-- Вид сверху -->
  <g transform="translate(10, 120)">
    <text x="0" y="10" fill="#94a3b8" font-size="10" font-weight="bold">ВИД СВЕРХУ</text>
    
    <!-- Корпус -->
    <path d="M 40,40 L 60,33 L 420,33 L 440,40 L 420,47 L 60,47 Z" 
          fill="#1e293b" stroke="#475569" stroke-width="1"/>
    
    <!-- Отсеки -->
    <rect x="60" y="35" width="72" height="10" fill="#16a34a" opacity="0.7" stroke="#475569" stroke-width="0.5"/>
    <rect x="132" y="35" width="72" height="10" fill="#16a34a" opacity="0.7" stroke="#475569" stroke-width="0.5"/>
    <rect x="204" y="35" width="72" height="10" fill="#16a34a" opacity="0.7" stroke="#475569" stroke-width="0.5"/>
    <rect x="276" y="35" width="72" height="10" fill="#16a34a" opacity="0.7" stroke="#475569" stroke-width="0.5"/>
    <rect x="348" y="35" width="72" height="10" fill="#16a34a" opacity="0.7" stroke="#475569" stroke-width="0.5"/>
  </g>
  
  <!-- Легенда -->
  <g transform="translate(10, 185)">
    <rect x="0" y="0" width="8" height="8" fill="#16a34a"/>
    <text x="12" y="7" fill="#94a3b8" font-size="8">Целый</text>
    
    <rect x="60" y="0" width="8" height="8" fill="#ea580c"/>
    <text x="72" y="7" fill="#94a3b8" font-size="8">Повреждён</text>
    
    <rect x="140" y="0" width="8" height="8" fill="#2563eb"/>
    <text x="152" y="7" fill="#94a3b8" font-size="8">Затоплен</text>
    
    <rect x="210" y="0" width="8" height="8" fill="#dc2626"/>
    <text x="222" y="7" fill="#94a3b8" font-size="8">Разрушен</text>
  </g>
</svg>
