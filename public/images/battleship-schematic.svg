<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 498 200">
  <rect fill="#0f172a" width="498" height="200"/>
  
  <!-- Вид сбоку -->
  <g transform="translate(10, 10)">
    <text x="0" y="10" fill="#94a3b8" font-size="10" font-weight="bold">ВИД СБОКУ - Линкор</text>
    
    <!-- Корпус -->
    <path d="M 20,80 L 40,60 L 440,60 L 460,80 L 440,100 L 40,100 Z" 
          fill="#1e293b" stroke="#475569" stroke-width="1"/>
    
    <!-- Отсеки -->
    <rect x="40" y="65" width="80" height="30" fill="#16a34a" opacity="0.7" stroke="#475569" stroke-width="0.5"/>
    <rect x="120" y="65" width="80" height="30" fill="#16a34a" opacity="0.7" stroke="#475569" stroke-width="0.5"/>
    <rect x="200" y="65" width="80" height="30" fill="#16a34a" opacity="0.7" stroke="#475569" stroke-width="0.5"/>
    <rect x="280" y="65" width="80" height="30" fill="#16a34a" opacity="0.7" stroke="#475569" stroke-width="0.5"/>
    <rect x="360" y="65" width="80" height="30" fill="#16a34a" opacity="0.7" stroke="#475569" stroke-width="0.5"/>
    
    <!-- Башни -->
    <circle cx="100" cy="55" r="8" fill="#334155" stroke="#64748b" stroke-width="1"/>
    <circle cx="240" cy="55" r="8" fill="#334155" stroke="#64748b" stroke-width="1"/>
    <circle cx="380" cy="55" r="8" fill="#334155" stroke="#64748b" stroke-width="1"/>
    
    <!-- Мостик -->
    <rect x="220" y="45" width="40" height="15" fill="#475569" stroke="#64748b" stroke-width="1"/>
  </g>
  
  <!-- Вид сверху -->
  <g transform="translate(10, 120)">
    <text x="0" y="10" fill="#94a3b8" font-size="10" font-weight="bold">ВИД СВЕРХУ</text>
    
    <!-- Корпус -->
    <path d="M 20,40 L 40,25 L 440,25 L 460,40 L 440,55 L 40,55 Z" 
          fill="#1e293b" stroke="#475569" stroke-width="1"/>
    
    <!-- Отсеки -->
    <rect x="40" y="30" width="80" height="20" fill="#16a34a" opacity="0.7" stroke="#475569" stroke-width="0.5"/>
    <rect x="120" y="30" width="80" height="20" fill="#16a34a" opacity="0.7" stroke="#475569" stroke-width="0.5"/>
    <rect x="200" y="30" width="80" height="20" fill="#16a34a" opacity="0.7" stroke="#475569" stroke-width="0.5"/>
    <rect x="280" y="30" width="80" height="20" fill="#16a34a" opacity="0.7" stroke="#475569" stroke-width="0.5"/>
    <rect x="360" y="30" width="80" height="20" fill="#16a34a" opacity="0.7" stroke="#475569" stroke-width="0.5"/>
  </g>
  
  <!-- Легенда -->
  <g transform="translate(10, 185)">
    <rect x="0" y="0" width="8" height="8" fill="#16a34a"/>
    <text x="12" y="7" fill="#94a3b8" font-size="8">Целый</text>
    
    <rect x="60" y="0" width="8" height="8" fill="#ea580c"/>
    <text x="72" y="7" fill="#94a3b8" font-size="8">Повреждён</text>
    
    <rect x="140" y="0" width="8" height="8" fill="#2563eb"/>
    <text x="152" y="7" fill="#94a3b8" font-size="8">Затоплен</text>
    
    <rect x="210" y="0" width="8" height="8" fill="#dc2626"/>
    <text x="222" y="7" fill="#94a3b8" font-size="8">Разрушен</text>
  </g>
</svg>
