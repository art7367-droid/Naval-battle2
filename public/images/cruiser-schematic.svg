<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 498 200">
  <rect fill="#0f172a" width="498" height="200"/>
  
  <!-- Вид сбоку -->
  <g transform="translate(10, 10)">
    <text x="0" y="10" fill="#94a3b8" font-size="10" font-weight="bold">ВИД СБОКУ - Крейсер</text>
    
    <!-- Корпус -->
    <path d="M 30,80 L 50,65 L 430,65 L 450,80 L 430,95 L 50,95 Z" 
          fill="#1e293b" stroke="#475569" stroke-width="1"/>
    
    <!-- Отсеки -->
    <rect x="50" y="70" width="75" height="20" fill="#16a34a" opacity="0.7" stroke="#475569" stroke-width="0.5"/>
    <rect x="125" y="70" width="75" height="20" fill="#16a34a" opacity="0.7" stroke="#475569" stroke-width="0.5"/>
    <rect x="200" y="70" width="75" height="20" fill="#16a34a" opacity="0.7" stroke="#475569" stroke-width="0.5"/>
    <rect x="275" y="70" width="75" height="20" fill="#16a34a" opacity="0.7" stroke="#475569" stroke-width="0.5"/>
    <rect x="350" y="70" width="75" height="20" fill="#16a34a" opacity="0.7" stroke="#475569" stroke-width="0.5"/>
    
    <!-- Башни -->
    <circle cx="100" cy="60" r="6" fill="#334155" stroke="#64748b" stroke-width="1"/>
    <circle cx="240" cy="60" r="6" fill="#334155" stroke="#64748b" stroke-width="1"/>
    <circle cx="380" cy="60" r="6" fill="#334155" stroke="#64748b" stroke-width="1"/>
    
    <!-- Мостик -->
    <rect x="220" y="50" width="40" height="15" fill="#475569" stroke="#64748b" stroke-width="1"/>
  </g>
  
  <!-- Вид сверху -->
  <g transform="translate(10, 120)">
    <text x="0" y="10" fill="#94a3b8" font-size="10" font-weight="bold">ВИД СВЕРХУ</text>
    
    <!-- Корпус -->
    <path d="M 30,40 L 50,30 L 430,30 L 450,40 L 430,50 L 50,50 Z" 
          fill="#1e293b" stroke="#475569" stroke-width="1"/>
    
    <!-- Отсеки -->
    <rect x="50" y="33" width="75" height="14" fill="#16a34a" opacity="0.7" stroke="#475569" stroke-width="0.5"/>
    <rect x="125" y="33" width="75" height="14" fill="#16a34a" opacity="0.7" stroke="#475569" stroke-width="0.5"/>
    <rect x="200" y="33" width="75" height="14" fill="#16a34a" opacity="0.7" stroke="#475569" stroke-width="0.5"/>
    <rect x="275" y="33" width="75" height="14" fill="#16a34a" opacity="0.7" stroke="#475569" stroke-width="0.5"/>
    <rect x="350" y="33" width="75" height="14" fill="#16a34a" opacity="0.7" stroke="#475569" stroke-width="0.5"/>
  </g>
  
  <!-- Легенда -->
  <g transform="translate(10, 185)">
    <rect x="0" y="0" width="8" height="8" fill="#16a34a"/>
    <text x="12" y="7" fill="#94a3b8" font-size="8">Целый</text>
    
    <rect x="60" y="0" width="8" height="8" fill="#ea580c"/>
    <text x="72" y="7" fill="#94a3b8" font-size="8">Повреждён</text>
    
    <rect x="140" y="0" width="8" height="8" fill="#2563eb"/>
    <text x="152" y="7" fill="#94a3b8" font-size="8">Затоплен</text>
    
    <rect x="210" y="0" width="8" height="8" fill="#dc2626"/>
    <text x="222" y="7" fill="#94a3b8" font-size="8">Разрушен</text>
  </g>
</svg>
